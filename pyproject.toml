[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crewforge"
version = "0.2.1"
description = "One crew of LLM agents, five recipes: code review, document Q&A, API scaffolding, content and honest academic-writing help — on any OpenAI-compatible provider."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Muhammad Aiman" }]
keywords = [
    "llm",
    "agents",
    "multi-agent",
    "ai-agents",
    "openai",
    "openai-compatible",
    "code-review",
    "rag",
    "document-qa",
    "fastapi",
    "api-scaffolding",
    "content-generation",
    "academic-writing",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Natural Language :: Malay",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
docs = ["pymupdf>=1.24", "python-docx>=1.1"]
api = ["fastapi>=0.110"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/aimanmalib/crewforge"
Documentation = "https://github.com/aimanmalib/crewforge#readme"
Changelog = "https://github.com/aimanmalib/crewforge/blob/main/CHANGELOG.md"
Issues = "https://github.com/aimanmalib/crewforge/issues"
Source = "https://github.com/aimanmalib/crewforge"
Security = "https://github.com/aimanmalib/crewforge/security/policy"

[project.scripts]
crewforge = "crewforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crewforge = ["py.typed", "recipes/api/templates/*.j2", "recipes/academic/locales/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Explicit rule set so a new ruff release cannot silently change what CI enforces.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
# CI runs `mypy` (lint job). Bodies of unannotated functions are checked too.
files = ["src/crewforge"]
python_version = "3.10"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Pre-1.24 PyMuPDF import name, used only as a fallback; it ships no type information.
module = ["fitz"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["crewforge"]
branch = true

[tool.ruff.lint.isort]
known-first-party = ["crewforge", "tests"]
