name: Release

# Publishes to PyPI with Trusted Publishing (OIDC, no API token) only when a
# GitHub Release is published. Configure the "pypi" environment and the
# trusted publisher on PyPI before the first release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: false # never restore a cache into a publishing job
      # Same build as the CI base-install job (sdist, then the wheel from the sdist).
      - run: uv build
      # README renders on PyPI and the metadata is well-formed.
      - run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crewforge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
