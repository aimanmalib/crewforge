name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest -q -W error::DeprecationWarning --cov --cov-report=term
      - name: Coverage in the job summary
        run: |
          total=$(python -m coverage report --format=total)
          {
            echo "### Coverage (Python ${{ matrix.python-version }}): ${total}%"
            echo
            echo "Line + branch coverage of \`src/crewforge\` from the test run above."
            echo
            echo "<details><summary>Per-module report</summary>"
            echo
            python -m coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: ${total}%"

  base-install:
    # The base install must work without the docs/api extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Smoke the installed CLI (no LLM, no key)
        run: |
          crewforge --version
          crewforge providers
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('fastapi') is not None)"
          printf '{"openapi":"3.1.0","info":{"title":"T","version":"1"},"paths":{"/x":{"get":{"summary":"x","responses":{"200":{"description":"ok"}}}}}}' > spec.json
          crewforge validate spec.json
          crewforge academic --help
          printf '{"v":1,"ts":"2026-10-22T00:00:00+00:00","step":"cite","model":"m","provider":"p","inputs":[{"name":"refs.txt"}],"counts":{"references":2},"style":"apa"}\n' > log.jsonl
          crewforge academic disclose --log log.jsonl --language ms | grep -q "Pernyataan Penggunaan AI"
          printf '{"openapi":"3.1.0","info":{"title":"T","version":"1"},"paths":{}}' > empty.json
          if crewforge validate empty.json; then echo "empty spec must fail"; exit 1; fi
