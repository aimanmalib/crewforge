name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          python-version: "3.12"
      # ruff and mypy come from uv.lock, so a new release cannot change what CI enforces.
      # The docs extra is installed so mypy checks the PyMuPDF/python-docx calls.
      - run: uv sync --locked --extra dev --extra docs
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Type check (mypy, config in pyproject.toml)
        run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python-version }}
      # Exact versions and hashes from uv.lock; fails if the lock is out of date.
      - run: uv sync --locked --extra dev --extra docs
      - run: uv run --no-sync pytest -q -W error::DeprecationWarning --cov --cov-report=term
      - name: Coverage in the job summary
        run: |
          total=$(uv run --no-sync coverage report --format=total)
          {
            echo "### Coverage (Python ${{ matrix.python-version }}): ${total}%"
            echo
            echo "Line + branch coverage of \`src/crewforge\` from the test run above."
            echo
            echo "<details><summary>Per-module report</summary>"
            echo
            uv run --no-sync coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: ${total}%"

  base-install:
    # What a user does: build the wheel, then a plain `pip install` of it with
    # dependencies resolved from PyPI (not from uv.lock). The base install must
    # work without the docs/api extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
      - run: uv build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install dist/*.whl
      - name: Smoke the installed CLI (no LLM, no key)
        run: |
          crewforge --version
          crewforge providers
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('fastapi') is not None)"
          printf '{"openapi":"3.1.0","info":{"title":"T","version":"1"},"paths":{"/x":{"get":{"summary":"x","responses":{"200":{"description":"ok"}}}}}}' > spec.json
          crewforge validate spec.json
          crewforge academic --help
          printf '{"v":1,"ts":"2026-10-22T00:00:00+00:00","step":"cite","model":"m","provider":"p","inputs":[{"name":"refs.txt"}],"counts":{"references":2},"style":"apa"}\n' > log.jsonl
          crewforge academic disclose --log log.jsonl --language ms | grep -q "Pernyataan Penggunaan AI"
          printf '{"openapi":"3.1.0","info":{"title":"T","version":"1"},"paths":{}}' > empty.json
          if crewforge validate empty.json; then echo "empty spec must fail"; exit 1; fi
