<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">crewforge</title>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f26"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
  </defs>
  <!-- ink tile shared with Codr and MyPII -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#tile)"/>
  <rect x="17" y="17" width="222" height="222" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- mark: three agents (the crew) whose paths meet in one result (amber) -->
  <g fill="none" stroke="#f4f4f1" stroke-width="12" stroke-linecap="round">
    <path d="M78 76 C128 76 136 128 176 128"/>
    <path d="M78 128 L176 128"/>
    <path d="M78 180 C128 180 136 128 176 128"/>
  </g>
  <g fill="#f4f4f1"><circle cx="72" cy="76" r="18"/><circle cx="72" cy="128" r="18"/><circle cx="72" cy="180" r="18"/></g>
  <circle cx="182" cy="128" r="28" fill="#e8b04a"/>
</svg>
